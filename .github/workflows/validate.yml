name: Validate FXOTP Examples

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate FXOTP Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/validator/requirements.txt

      - name: Validate XAUUSD example
        run: |
          python tools/validator/validate.py examples/metals/xauusd-buy.json
