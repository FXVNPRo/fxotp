name: Validate FXOTP Examples

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate FXOTP Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/validator/requirements.txt

      - name: Validate all FXOTP examples
        shell: bash
        run: |
          set -e

          echo "Searching for FXOTP example messages..."

          count=0

          while IFS= read -r -d '' file; do
            echo ""
            echo "Validating: $file"
            python tools/validator/validate.py "$file"
            count=$((count + 1))
          done < <(find examples -type f -name "*.json" -print0)

          echo ""
          echo "Validated $count FXOTP example(s)."
                - name: Run FXOTP test suite
        run: |
          python tools/validator/run_tests.py

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No FXOTP examples found."
            exit 1
          fi
